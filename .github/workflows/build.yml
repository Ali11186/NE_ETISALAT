name: NE ETISALAT Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options:
          - debug
          - profile
          - release

      output_type:
        description: Output type
        required: true
        default: apk
        type: choice
        options:
          - apk
          - appbundle
          - apk-split

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable

      - run: flutter pub get

      - run: flutter create --platforms android .

      - name: Build
        run: |
          TYPE="${{ inputs.build_type }}"
          OUT="${{ inputs.output_type }}"

          if [ "$OUT" = "apk" ]; then
            flutter build apk --$TYPE
          fi

          if [ "$OUT" = "apk-split" ]; then
            flutter build apk --$TYPE --split-per-abi
          fi

          if [ "$OUT" = "appbundle" ]; then
            flutter build appbundle --$TYPE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ne-etisalat-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          retention-days: 7
